<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    html { background-color: #fff; }
    * { margin: 0; padding: 0; }
    body {
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', Courier, monospace;
    }

    .container {
      position: relative;
      width: 100px;
      height: 100px;
      /** 3D效果需要设置透视距离 */
      perspective: 300px;
    }

    .box {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      text-align: center;
      line-height: 100px;
      font-size: 30px;
      font-weight: 500;
      transition: transform 0.5s;
      /** 关键属性: 隐藏背面，避免显示在其他元素后面 */
      backface-visibility: hidden;
      /** 之后绝对定位在一块 */
      position: absolute;
      top: 0;
      left: 0;

      &.red {
        background-color: #f00;
      }
      &.blue {
        background-color: #00f;
        transform: rotateY(180deg);
      }
    }

    .container:hover .red {
      transform: rotateY(180deg);
    }
    .container:hover .blue {
      transform: rotateY(0deg);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="box red">1</div>
    <div class="box blue">2</div>
  </div>
</body>

</html>
